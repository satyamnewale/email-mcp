[project]
name = "gmail-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.6",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "pydantic>=2.14.1",
    "tzlocal>=5.4.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.15.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-ra",
    "--strict-markers",
    "--cov=server",
    "--cov=services",
    "--cov=validator",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
]

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
